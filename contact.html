<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contact Molly Channon about curatorial projects, writing, and collaborations.">
<title>Contact — Molly Channon</title>
<link rel="stylesheet" href="style.css">
<style>
.contact-page { max-width: 720px; margin: clamp(48px, 8vw, 100px) auto; padding: 0 24px; min-height: 60vh; }
.contact-page h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 400; margin: 0 0 24px; }
.contact-page .contact-intro { margin-bottom: 36px; line-height: 1.6; }
.contact-form { display: grid; gap: 24px; }
.contact-form label { display: block; margin-bottom: 8px; }
.contact-form input, .contact-form textarea { box-sizing: border-box; width: 100%; border: 1px solid #888; border-radius: 0; padding: 12px; background: transparent; color: inherit; font: inherit; }
.contact-form textarea { resize: vertical; min-height: 160px; }
.contact-form button { justify-self: start; border: 1px solid currentColor; border-radius: 0; padding: 12px 24px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.contact-form button:hover { background: #eee; color: #111; }
.contact-form :focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.contact-form .form-note { font-size: .875rem; line-height: 1.5; margin: 0; }
.site-header nav { flex-wrap: wrap; }
.contact-form button:disabled { opacity: .6; cursor: wait; }
#form-status:empty { display: none; }
</style>
</head>
<body>
<header class="site-header">
  <a class="name" href="index.html">Molly Channon</a>
  <nav aria-label="Primary">
    <a href="index.html#projects">Projects</a>
    <a href="index.html#about">About</a>
    <a href="Channon_CV_2026.pdf">CV</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <a href="https://www.instagram.com/add__glitter/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
  </nav>
</header>
<main id="top" class="contact-page">
  <h1>Contact</h1>
  <form class="contact-form" id="contact-form" action="https://formspree.io/f/xrpbrkob" method="post">
    <div><label for="contact-name">Name (required)</label><input id="contact-name" name="name" autocomplete="name" maxlength="150" required></div>
    <div><label for="contact-email">Email (required)</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
    <div><label for="contact-message">Message (required)</label><textarea id="contact-message" name="message" rows="7" maxlength="4000" required></textarea></div>
    <button type="submit">Send</button>
    <p class="form-note" id="form-status" role="status"></p>
  </form>
</main>
<footer><span>© 2026 Molly Channon</span><a href="index.html">Back to home ↑</a></footer>
<script>
const form = document.getElementById('contact-form');
let submitting = false;
form.addEventListener('submit', async function (event) {
  event.preventDefault();
  if (submitting || !form.reportValidity()) return;
  const status = document.getElementById('form-status');
  const button = form.querySelector('button[type="submit"]');
  const data = new FormData(form);
  const name = String(data.get('name') || '').trim();
  const message = String(data.get('message') || '').trim();
  if (!name || !message) {
    status.textContent = 'Please enter your name and message.';
    return;
  }
  data.set('name', name);
  data.set('message', message);
  submitting = true;
  button.disabled = true;
  button.textContent = 'Sending…';
  status.textContent = '';
  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    });
    if (!response.ok) throw new Error('Submission failed');
    status.textContent = 'Thank you—your message has been sent.';
    form.reset();
  } catch (error) {
    status.textContent = 'Your message could not be confirmed as sent. Please try again, or email ma.channon@gmail.com directly.';
  } finally {
    submitting = false;
    button.disabled = false;
    button.textContent = 'Send';
  }
});
</script>
</body>
</html>
